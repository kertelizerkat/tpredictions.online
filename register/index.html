<body id='bs2_' class="bs">
  <script>
  function return_(){
    let p =getHomePath() + "/index.html"
    window.location.assign(p)
  }
</script>
 <div class="back-button" onclick="return_()" title="Go back">
    <svg viewBox="0 0 24 24">
      <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>

     <div class="com_name"><img id="iconm" style="border-radius: 50%;width:50px;height:50px" src="../favicon.ico" alt="">&nbsp; Hi USER!</div>
  <div class="registration-container">
    <div class="registration-form">
      <h2 class="reg_h">Register</h2>
      <form id="registrationForm" onsubmit="return validateForm()">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="input-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" required>
        </div>
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required maxlength="11" minlength="3">
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button id="btn_s" type="submit">Register</button>
        <p class="message">Already registered? <a href="../login/index.html">Login</a></p>
      </form>
    </div>
  </div>
  <p class="message m2"> By continuing, you agree to our <a href='../Terms _and_Conditions/index.html'>Terms and Conditions</a></p>
  
  <script src="js/reg.js"></script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sports Team Performance Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #000;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    header {
      text-align: center;
      padding: 20px;
      background: #0056b3;
      border-radius: 10px;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      padding: 8px 15px;
      border-radius: 5px;
      background: #333;
      transition: background 0.3s;
    }
    nav a:hover {
      background: #555;
    }
    section {
      margin: 40px 0;
    }
    h1, h2 {
      color: #0056b3;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .team-card {
      background: #111;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      opacity: 0;
      animation: fadeIn 0.5s ease-in-out forwards;
      transition: transform 0.3s;
    }
    .team-card:hover {
      transform: scale(1.03);
    }
    .team-card img {
      width: 50px;
      height: auto;
      margin-bottom: 10px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #streakChart {
      max-width: 800px;
      margin: 20px auto;
      background: #111;
      padding: 20px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Team Performance Dashboard</h1>
  </header>
  <nav id="streak-nav"></nav>
  <section id="stats">
    <h2>Overall Statistics</h2>
    <canvas id="streakChart"></canvas>
  </section>
  <main id="content"></main>

    function parseContent(content) {
      const parts = content.split(' has ');
      const teamName = parts[0].trim();
      const rest = parts[1];
      const numberMatch = rest.match(/\d+/);
      const number = numberMatch ? parseInt(numberMatch[0]) : null;
      const isHome = rest.includes('home');
      const isAway = rest.includes('away');
      let streakType = '';
      if (rest.includes('won all their last') && !isHome && !isAway) {
        streakType = 'Winning Streak';
      Binder

        streakType = 'Not Winning Away Streak';
      } else if (rest.includes('lost all their last') && !isHome && !isAway) {
        streakType = 'Losing Streak';
      } else {
        streakType = 'Other';
      }
      const leagueMatch = rest.match(/played in ([\w\s]+)\s\./);
      const league = leagueMatch ? leagueMatch[1].trim() : '';
      return { teamName, number, streakType, league };
    }

;

    // Enhance data with parsed fields
    data.forEach(item => {
      const parsed = parseContent(item.content);
      item.teamName = parsed.teamName;
      item.number = parsed.number;
      item.streakType = parsed.streakType;
      item.league = parsed.league;
      item.country = item.img_src.split('/').pop().replace('.png', '');
    });

    // Group data by streak type
    const groupedData = {};
    data.forEach(item => {
      if (!groupedData[item.streakType]) {
        groupedData[item.streakType] = [];
      }
      groupedData[item.streakType].push(item);
    });

    // Sort each group by streak length (descending)
    for (const type in groupedData) {
      groupedData[type].sort((a, b) => b.number - a.number);
    }

    // Generate navigation menu
    const streakTypes = Object.keys(groupedData);
    const nav = document.getElementById('streak-nav');
    streakTypes.forEach(type => {
      const link = document.createElement('a');
      link.href = `#${type.replace(/\s+/g, '-').toLowerCase()}`;
      link.textContent = type;
      nav.appendChild(link);
    });

    // Generate sections for each streak type
    const content = document.getElementById('content');
    for (const type in groupedData) {
      const section = document.createElement('section');
      section.id = type.replace(/\s+/g, '-').toLowerCase();
      const header = document.createElement('h2');
      header.textContent = type;
      section.appendChild(header);
      const longest = groupedData[type][0];
      const p = document.createElement('p');
      p.textContent = `Longest: ${longest.teamName} - ${longest.number} matches`;
      section.appendChild(p);
      const grid = document.createElement('div');
      grid.className = 'grid';
      groupedData[type].forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'team-card';
        card.style.animationDelay = `${index * 0.1}s`;
        card.innerHTML = `
          <img src="${item.img_src}" alt="${item.country}">
          <h3>${item.teamName} (${item.league})</h3>
          <p>${item.number} matches</p>
          <p>${item.content}</p>
        `;
        grid.appendChild(card);
      });
      section.appendChild(grid);
      content.appendChild(section);
    }

    // Create bar chart for streak type distribution
    const teamCounts = streakTypes.map(type => groupedData[type].length);
    const ctx = document.getElementById('streakChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: streakTypes,
        datasets: [{
          label: 'Number of Teams',
          data: teamCounts,
          backgroundColor: '#0056b3',
          borderColor: '#fff',
          borderWidth: 1
        }]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true,
            title: {
              display: true,
              text: 'Number of Teams',
              color: '#fff'
            }
          },
          x: {
            title: {
              display: true,
              text: 'Streak Type',
              color: '#fff'
            }
          }
        },
        plugins: {
          legend: {
            labels: {
              color: '#fff'
            }
          }
        }
      }
    });
  </script>
</body>
